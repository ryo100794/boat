[program:boatrace-intraday-t300-shadow]
command=/workspace/boat/scripts/deployment/run-boatrace-intraday-t300-shadow.sh
directory=/workspace/boat
priority=47
autostart=false
autorestart=true
startsecs=10
startretries=20
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/runtime/intraday-t300-shadow.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
