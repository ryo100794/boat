[program:boatrace-daily-shadow-bundle-update]
command=/workspace/boat/scripts/deployment/run-boatrace-daily-shadow-bundle-update.sh
directory=/workspace/boat
priority=46
autostart=false
autorestart=true
startsecs=10
startretries=20
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/runtime/daily-shadow-bundle-update.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=5
redirect_stderr=true

[program:boatrace-intraday-t300-daily-bundles]
command=/workspace/boat/scripts/deployment/run-boatrace-intraday-t300-daily-bundles.sh
directory=/workspace/boat
priority=47
autostart=false
autorestart=true
startsecs=10
startretries=20
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/runtime/intraday-t300-daily-bundles.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
