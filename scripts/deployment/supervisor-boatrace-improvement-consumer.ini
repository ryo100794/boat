[program:boatrace-improvement-consumer]
command=/workspace/boat/.venv/bin/python -m boatrace_ai.improvement_result_consumer --db "host=127.0.0.1 port=5432 dbname=boatrace user=boatrace_app" --poll-seconds 60 --batch-size 500 --settle-seconds 3600
directory=/workspace/boat
priority=61
autostart=true
autorestart=true
startsecs=5
startretries=20
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/evaluation_queue/improvement-consumer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/boat/src",PGPASSFILE="/workspace/postgresql/conf/databases/boatrace.pgpass",BOATRACE_PG_APPLICATION_NAME="boatrace_improvement_consumer",BOATRACE_PG_WORK_MEM="32MB",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1"
