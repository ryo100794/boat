[program:boatrace-evaluation-scheduler]
command=/workspace/boat/.venv/bin/python -m boatrace_ai.evaluation_queue schedule --db "host=127.0.0.1 port=5432 dbname=boatrace user=boatrace_app" --app-root /workspace/boat --seed-defaults --poll-seconds 5 --schedule-interval 60 --seed-interval 3600 --stale-minutes 180
directory=/workspace/boat
priority=60
autostart=true
autorestart=true
startsecs=5
startretries=20
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/evaluation_queue/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/boat/src",PGPASSFILE="/workspace/postgresql/conf/databases/boatrace.pgpass",BOATRACE_PG_APPLICATION_NAME="boatrace_scheduler",BOATRACE_PG_WORK_MEM="32MB",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1"
