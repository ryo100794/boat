[program:boatrace-quota-ceil-shadow]
command=/workspace/boat/scripts/deployment/run-boatrace-quota-ceil-shadow.sh
directory=/workspace/boat
priority=50
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/runtime/quota-ceil-shadow.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=5
redirect_stderr=true
