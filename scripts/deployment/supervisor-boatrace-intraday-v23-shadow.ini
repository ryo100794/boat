[program:boatrace-intraday-v23-shadow]
command=/workspace/boat/scripts/deployment/run-boatrace-intraday-v23-shadow.sh
directory=/workspace/boat
priority=48
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/boat/logs/runtime/intraday-v23-shadow.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=5
redirect_stderr=true
